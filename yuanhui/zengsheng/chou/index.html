      $(document).ready(function () {

      //控制中奖结果
      function rnd(n, m) {
        var random = 11;
        //var random = Math.floor(Math.random()*(m-n+1)+n);
        return random;

      //页面所有元素加载完毕后执行drawRouletteWheel()方法对转盘进行渲染
      window.onload = function () {

      };

      function drawRouletteWheel() {
        var canvas = document.getElementById("wheelcanvas");
        if (canvas.getContext) {
          //根据奖品个数计算圆周角度
          var arc = Math.PI / (turnplate.restaraunts.length / 2);
          var ctx = canvas.getContext("2d");
          //在给定矩形内清空一个矩形
          ctx.clearRect(0, 0, 422, 422);
          //strokeStyle 属性设置或返回用于笔触的颜色、渐变或模式
          ctx.strokeStyle = "#FFBE04";
          //font 属性设置或返回画布上文本内容的当前字体属性
          ctx.font = "16px Microsoft YaHei";
          for (var i = 0; i < turnplate.restaraunts.length; i++) {
            var angle = turnplate.startAngle + i * arc;
            ctx.fillStyle = turnplate.colors[i];
            ctx.beginPath();
            //arc(x,y,r,起始角,结束角,绘制方向) 方法创建弧/曲线（用于创建圆或部分圆）
            ctx.arc(
              211,
              211,
              turnplate.outsideRadius,
              angle,
              angle + arc,
              false,
            );
            ctx.arc(211, 211, turnplate.insideRadius, angle + arc, angle, true);
            ctx.stroke();
            ctx.fill();
            //锁画布(为了保存之前的画布状态)
            ctx.save();

            //----绘制奖品开始----
            ctx.fillStyle = "#E5302F";
            var text = turnplate.restaraunts[i];
            var line_height = 17;
            //translate方法重新映射画布上的 (0,0) 位置
            ctx.translate(
              211 + Math.cos(angle + arc / 2) * turnplate.textRadius,
              211 + Math.sin(angle + arc / 2) * turnplate.textRadius,
            );

            //rotate方法旋转当前的绘图
            ctx.rotate(angle + arc / 2 + Math.PI / 2);

            /** 下面代码根据奖品类型、奖品名称长度渲染不同效果，如字体、颜色、图片效果。(具体根据实际情况改变) **/
            if (text.indexOf("M") > 0) {
              //流量包
              var texts = text.split("M");
              for (var j = 0; j < texts.length; j++) {
                ctx.font =
                  j == 0 ? "bold 20px Microsoft YaHei" : "16px Microsoft YaHei";
                if (j == 0) {
                  ctx.fillText(
                    texts[j] + "M",
                    -ctx.measureText(texts[j] + "M").width / 2,
                    j * line_height,
                  );
                } else {
                  ctx.fillText(
                    texts[j],
                    -ctx.measureText(texts[j]).width / 2,
                    j * line_height,
                  );
                }
              }
            } else if (text.indexOf("M") == -1 && text.length > 6) {
              //奖品名称长度超过一定范围
              text = text.substring(0, 6) + "||" + text.substring(6);
              var texts = text.split("||");
              for (var j = 0; j < texts.length; j++) {
                ctx.fillText(
                  texts[j],
                  -ctx.measureText(texts[j]).width / 2,
                  j * line_height,
                );
              }
            } else {
              //在画布上绘制填色的文本。文本的默认颜色是黑色
              //measureText()方法返回包含一个对象，该对象包含以像素计的指定字体宽度
              ctx.fillText(text, -ctx.measureText(text).width / 2, 0);
            }

            //添加对应图标
            if (text.indexOf("闪币") > 0) {
              var img = document.getElementById("shan-img");
              img.onload = function () {
                ctx.drawImage(img, -15, 10);
              };
              ctx.drawImage(img, -15, 10);
            } else if (text.indexOf("谢谢参与") >= 0) {
              var img = document.getElementById("sorry-img");
              img.onload = function () {
                ctx.drawImage(img, -15, 10);
              };
              ctx.drawImage(img, -15, 10);
            }
            //把当前画布返回（调整）到上一个save()状态之前
            ctx.restore();
            //----绘制奖品结束----
          }
        }
      }

  <script>
    //h5复制文本到剪切板
    function copyContentH5(content) {
      var copyDom = document.createElement("div");
      copyDom.innerText = content;
      copyDom.style.position = "absolute";
      copyDom.style.top = "0px";
      copyDom.style.right = "-9999px";
      document.body.appendChild(copyDom);
      //创建选中范围
      var range = document.createRange();
      range.selectNode(copyDom);
      //移除剪切板中内容
      window.getSelection().removeAllRanges();
      //添加新的内容到剪切板
      window.getSelection().addRange(range);
      //复制
      var successful = document.execCommand("copy");
      copyDom.parentNode.removeChild(copyDom);
      try {
        var msg = successful ? "successful" : "failed";
        $("#m-toast-pop").fadeIn();
        setTimeout(function () {
          $("#m-toast-pop").fadeOut();
          window.location.href = "../loveEffect.html";
        }, 4000);
      } catch (err) {
        $("#m-toast-inner-text").text("复制失败");
        $("#m-toast-pop").fadeIn();
        setTimeout(function () {
          $("#m-toast-pop").fadeOut();
        }, 2000);
      }
    }
  </script>

  <script>
    function getTime() {
      var myDate = new Date(); //创建Date对象
      var Y = myDate.getFullYear(); //获取当前完整年份
      var M = myDate.getMonth() + 1; //获取当前月份
      var D = myDate.getDate(); //获取当前日1-31
      var H = myDate.getHours(); //获取当前小时
      var i = myDate.getMinutes(); //获取当前分钟
      var s = myDate.getSeconds(); //获取当前秒数
      // 月份不足10补0
      if (M < 10) {
        M = "0" + M;
      }
      // 日不足10补0
      if (D < 10) {
        D = "0" + D;
      }
      // 小时不足10补0
      if (H < 10) {
        H = "0" + H;
      }
      // 分钟不足10补0
      if (i < 10) {
        i = "0" + i;
      }
      // 秒数不足10补0
      if (s < 10) {
        s = "0" + s;
      }
      // 拼接日期分隔符根据自己的需要来修改
      var nowDate = Y + "-" + M + "-" + D + " " + H + ":" + i + ":" + s;
      return nowDate;
    }
