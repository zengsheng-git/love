<!doctype html>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目预览集合</title>
    <style>
      /* 全局样式重置 */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      /* 基础样式 */
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f5f5f5;
        color: #333;
        line-height: 1.6;
        padding: 20px;
      }
      
      /* 页面标题 */
      header {
        text-align: center;
        margin-bottom: 40px;
        padding: 20px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }
      
      h1 {
        font-size: 2.5rem;
        margin-bottom: 10px;
        font-weight: 700;
      }
      
      .subtitle {
        font-size: 1.1rem;
        opacity: 0.9;
      }
      
      /* 预览容器 */
      .preview-div {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 30px;
        max-width: 1400px;
        margin: 0 auto;
      }
      
      /* 项目卡片 */
      .project-card {
        background: white;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 6px 15px rgba(0, 0, 0, 0.08);
        transition: all 0.3s ease;
        text-decoration: none;
        color: inherit;
        display: flex;
        flex-direction: column;
      }
      
      .project-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 12px 25px rgba(0, 0, 0, 0.15);
      }
      
      /* 项目图片 */
      .project-card img {
        width: 100%;
        height: 220px;
        object-fit: cover;
        transition: transform 0.3s ease;
      }
      
      .project-card:hover img {
        transform: scale(1.03);
      }
      
      /* 项目名称 */
      .project-card p {
        padding: 15px;
        font-size: 1.1rem;
        font-weight: 600;
        text-align: center;
        background: #f9f9f9;
        margin-top: auto;
      }
      
      /* 响应式设计 */
      @media (max-width: 768px) {
        body {
          padding: 10px;
        }
        
        header {
          margin-bottom: 20px;
          padding: 15px;
        }
        
        h1 {
          font-size: 2rem;
        }
        
        .preview-div {
          grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
          gap: 20px;
        }
        
        .project-card img {
          height: 180px;
        }
      }
      
      @media (max-width: 480px) {
        .preview-div {
          grid-template-columns: 1fr;
        }
        
        h1 {
          font-size: 1.8rem;
        }
      }
    </style>
  </head>
