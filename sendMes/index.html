<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />

    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>123</title>
    <script src="./jquery-1.11.0.min.js" type="text/javascript"></script>
    <style>
        body {
            width: 95%;
            height: 100%;
            background: pink;
        }

        .banner_bg {
            width: 100%;
            height: 100%;
            background-repeat: no-repeat;
            background-size: cover;
            filter: blur(3px);
            /* opacity: 0.8; */
            position: absolute;
            left: 0;
            top: 0;
            background-size: contain !important;
            /*z-index: 1000;*/
        }

        #input {
            display: inline-block;
            width: 95%;
            opacity: 0.8;
            min-width: 0;
            background-color: #fff;
            background-image: none;
            border-width: 1px;
            border-style: solid;
            border-color: #d9d9d9;
            border-radius: 6px;
            margin-top: 40px;
            padding: 4px 11px;
            color: rgba(0, 0, 0, 0.88);
            font-size: 18px;
            line-height: 1.5714285714285714;
            list-style: none;
            transition: all 0.2s;
        }

        .sendDiv {
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 100;
        }

        .btnsave {
            border-radius: 3px;
            box-shadow: none;
            cursor: pointer;
            color: #fff;
            text-align: center;
            margin-top: 12px;
            background: #1677ff;
            font-size: 25px;
            opacity: 0.8;
            margin-top: 50px;
            padding: 10px;
        }

        #title {
            font-size: 30px;
            color: rgba(255, 255, 255, 0.88);
            font-weight: 600;
        }

        #alert {
            box-sizing: border-box;
            display: none;
            background-color: #f6ffed;
            border: 1px solid #b7eb8f;
            margin-top: 20px;
            height: 60px;
            padding: 8px 12px;
            color: rgba(0, 0, 0, 0.88);
            font-size: 14px;
            line-height: 1.5714285714285714;
            list-style: none;
            position: relative;
            align-items: center;
            word-wrap: break-word;
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <div>
        <div class="banner_bg" id="banner_bg"></div>
        <div class="sendDiv">
            <div id="title"></div>
            <textarea id="input" placeholder="小蜜正在等待输入" rows="5"></textarea>
            <div class="btnsave" id="btnsave">立即发送</div>
            <div id="alert"></div>
        </div>
    </div>
</body>
<script>
    function getNum(num1, num2) {
        var max, min;
        if (num1 > num2) {
            max = num1;
            min = num2;
        } else {
            max = num2;
            min = num1;
        }
        return Math.round(Math.random() * (max - min) + min);
    }

    $(function () {
        $('#banner_bg').css('background', `url(../weather/wanziPic/${getNum(1, 86)}.jpg)`);
        let timer1 = setInterval(() => {
            $('#banner_bg').css('background', `url(../weather/wanziPic/${getNum(1, 86)}.jpg)`);
            $('#banner_bg').fadeOut(5000)
            $('#banner_bg').fadeIn(5000)
        }, 10000)
    })
</script>

<script>
    $(function () { });
</script>

<script>
    const data = {
        0: {
            url: '/sendTextApi/send/text',
            // url: "http://localhost:8288/send/text",
            title: "小蜜的文字提醒",
            successtext: '小蜜正在火速发送，请稍等3分钟再查收'
        },
        1: {
            url: '/sendTextApi/send/mubanText',
            // url: "http://localhost:8288/send/mubanText",
            title: "小蜜的模板消息",
            successtext: '小蜜发送成功啦'
        },
    };
    $(function () {
        const href = window.location.href;
        // console.log(data);
        const type = href.includes("text") ? 0 : 1;
        $("#title").text(data[type].title);

        // 点击发送事件
        $("#btnsave").click(function () {
            let input = $("#input").val();
            $.ajax({
                url: data[type].url,
                type: "post",
                data: {
                    dataText: input,
                },
                success: function (res) {
                    console.log(res);
                    if (res.code == 0) {
                        $('#alert').text(data[type].successtext);
                        $('#alert').fadeIn(1000);
                        let timer1 = setTimeout(() => {
                            $('#alert').fadeOut(1000);
                            $("#input").val('');
                        }, 1500)
                    }
                },
                error: function (res) {
                    console.log(res);
                },
            });
        });
    });
</script>

</html>
